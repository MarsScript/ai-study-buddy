name: PayPal Live safe-mode checks

on:
  pull_request:
    paths:
      - "functions/api/paypal-live/**"
      - "functions/api/support/**"
      - "functions/api/tickets.js"
      - "functions/api/ticket.js"
      - "functions/api/ticket/**"
      - "functions/api/paypal/**"
      - "tests/paypal-live-safe-mode.mjs"
      - "tests/support-admin-auth.mjs"
      - "tests/support-tickets-auth.mjs"
      - "tests/support-view-containment.mjs"
      - "sql/07_inapp_support_tickets.sql"
      - "public/styles.css"
      - "tests/complimentary-premium.mjs"
      - "sql/06_complimentary_premium.sql"
      - "tests/paypal-live-entitlement-contract.mjs"
      - "tests/paypal-sandbox-stale.mjs"
      - "public/app.js"
      - "public/index.html"
      - ".github/workflows/paypal-live-safe-mode.yml"
  push:
    branches: [main]
    paths:
      - "functions/api/paypal-live/**"
      - "functions/api/support/**"
      - "functions/api/tickets.js"
      - "functions/api/ticket.js"
      - "functions/api/ticket/**"
      - "functions/api/paypal/**"
      - "tests/paypal-live-safe-mode.mjs"
      - "tests/support-admin-auth.mjs"
      - "tests/support-tickets-auth.mjs"
      - "tests/support-view-containment.mjs"
      - "sql/07_inapp_support_tickets.sql"
      - "public/styles.css"
      - "tests/complimentary-premium.mjs"
      - "sql/06_complimentary_premium.sql"
      - "tests/paypal-live-entitlement-contract.mjs"
      - "tests/paypal-sandbox-stale.mjs"
      - "public/app.js"
      - "public/index.html"

permissions:
  contents: read

jobs:
  safe-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify JavaScript syntax
        run: |
          for file in functions/api/paypal-live/*.js; do
            node --check "$file"
          done
          node --check tests/paypal-live-safe-mode.mjs
          node --check tests/support-admin-auth.mjs
          node --check tests/support-tickets-auth.mjs
          node --check tests/support-view-containment.mjs
          node --check functions/api/ticket.js
          node --check functions/api/tickets.js
          node --check functions/api/ticket/_shared.js
          node --check tests/complimentary-premium.mjs
          for file in functions/api/support/*.js; do node --check "$file"; done
          node --check tests/paypal-live-entitlement-contract.mjs
          node --check tests/paypal-sandbox-stale.mjs
          node --check public/app.js
          node -e "const fs=require('fs');const h=fs.readFileSync('public/index.html','utf8');for(const id of ['paypal-live-status','paypal-live-refresh','paypal-live-benefit-proof','plan-free-tag','plan-premium-tag','paypal-live-reconcile','support-nav','support-lookup-form','support-customer-result','support-grant-controls','support-grant-button','support-revoke-button','support-grant-reason','support-grant-days','view-help','ticket-new-form','student-ticket-list','support-owner-inbox','owner-ticket-list']) if(!h.includes('id=\"' + id + '\"')) throw Error('Missing '+id);"
      - name: Verify checkout safety and webhook rejection
        run: |
          node --experimental-default-type=module tests/paypal-live-safe-mode.mjs
          node --experimental-default-type=module tests/support-admin-auth.mjs
          node --experimental-default-type=module tests/support-tickets-auth.mjs
          node --experimental-default-type=module tests/support-view-containment.mjs
          node --experimental-default-type=module tests/complimentary-premium.mjs
          node --experimental-default-type=module tests/paypal-live-entitlement-contract.mjs
          node --experimental-default-type=module tests/paypal-sandbox-stale.mjs
